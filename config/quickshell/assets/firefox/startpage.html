<!doctype html>
<!-- Сгенерировано Cove (services/FirefoxLook.qml из assets/firefox/startpage.html) — не редактировать -->
<html lang="@LANG@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cove</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='@ACCENT_URL@' stroke-linecap='round'%3E%3Cpath d='M48.06 14.17A24 24 0 1 0 48.06 49.83' stroke-width='7'/%3E%3Cpath d='M21 30Q26.5 24 32 30T43 30' stroke-width='4.5'/%3E%3Cpath d='M26 41Q31.5 35.5 37 41' stroke-width='4' opacity='.5'/%3E%3C/svg%3E">
<style>
:root {
  --crust: @CRUST@; --mantle: @MANTLE@; --base: @BASE@; --surface0: @SURFACE0@; --surface1: @SURFACE1@;
  --text: @TEXT@; --sub: @SUBTEXT@; --dim: @OVERLAY@; --accent: @ACCENT@; --accent2: @ACCENT2@;
  --radius: @RADIUS@px; --font: "@FONT@", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--crust); color: var(--text); font-family: var(--font); overflow: hidden; }
.bg { position: fixed; inset: -40px; background: url("@WALLPAPER@") center / cover no-repeat; filter: blur(28px) saturate(1.1); opacity: .55; }
.shade { position: fixed; inset: 0; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--crust) 35%, transparent), var(--crust) 85%); }
main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
.time { font-size: clamp(64px, 11vw, 132px); font-weight: 300; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
.date { color: var(--accent); font-size: 18px; margin-top: -8px; }
.hello { color: var(--sub); font-size: 15px; }
form { width: min(620px, 86vw); margin-top: 12px; }
.search { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 20px; border-radius: 999px;
  background: color-mix(in srgb, var(--mantle) 82%, transparent); border: 1px solid var(--surface1);
  box-shadow: 0 10px 40px rgba(0,0,0,.35); backdrop-filter: blur(14px); transition: border-color .2s; }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 20px; height: 20px; fill: var(--accent); flex: none; }
.search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font: 17px var(--font); }
.search input::placeholder { color: var(--dim); }
.hint { text-align: center; color: var(--dim); font-size: 12px; margin-top: 10px; min-height: 16px; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: min(760px, 90vw); margin-top: 6px; }
.links a { width: 92px; height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  border-radius: var(--radius); background: color-mix(in srgb, var(--mantle) 70%, transparent); border: 1px solid transparent;
  color: var(--sub); text-decoration: none; font-size: 12px; transition: transform .15s, border-color .15s, background .15s; }
.links a:hover { transform: translateY(-3px); border-color: var(--accent); background: color-mix(in srgb, var(--surface0) 80%, transparent); color: var(--text); }
.links img { width: 32px; height: 32px; border-radius: 8px; }
footer { position: fixed; bottom: 16px; width: 100%; display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; letter-spacing: 4px; }
footer svg { width: 18px; height: 18px; color: var(--accent); }
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<main>
  <div class="time" id="time">00:00</div>
  <div class="date" id="date"></div>
  <div class="hello" id="hello"></div>
  <form id="f" autocomplete="off">
    <label class="search">
      <svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 0 1 5.2 10.4l5.4 5.4-1.4 1.4-5.4-5.4A6.5 6.5 0 1 1 9.5 3m0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9"/></svg>
      <input id="q" autofocus>
    </label>
    <div class="hint" id="hint"></div>
  </form>
  <nav class="links" id="links"></nav>
</main>
<footer><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M48.06 14.17A24 24 0 1 0 48.06 49.83" stroke-width="7"/><path d="M21 30Q26.5 24 32 30T43 30" stroke-width="4.5"/><path d="M26 41Q31.5 35.5 37 41" stroke-width="4" opacity=".5"/></svg><span>cove</span></footer>
<script>
const T = "@LANG@" === "en"
  ? { loc: "en-US", hello: ["Good night", "Good morning", "Good afternoon", "Good evening"], ph: "Search or address · !yt cats", in: "Search in " }
  : { loc: "ru-RU", hello: ["Доброй ночи", "Доброе утро", "Добрый день", "Добрый вечер"], ph: "Поиск или адрес · !yt котики", in: "Поиск в " };
document.getElementById("q").placeholder = T.ph;
const NAME = @NAME_JSON@, LINKS = @LINKS_JSON@, BANGS = @BANGS_JSON@, ENGINE = @ENGINE_JSON@;
const pad = n => String(n).padStart(2, "0");
function tick() {
  const d = new Date(), h = d.getHours();
  document.getElementById("time").textContent = pad(h) + ":" + pad(d.getMinutes());
  const s = d.toLocaleDateString(T.loc, { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("date").textContent = s.charAt(0).toUpperCase() + s.slice(1);
  const hello = T.hello[h < 5 ? 0 : h < 12 ? 1 : h < 18 ? 2 : 3];
  document.getElementById("hello").textContent = hello + ", " + NAME;
}
tick(); setInterval(tick, 1000);
const nav = document.getElementById("links");
for (const l of LINKS) {
  const a = document.createElement("a");
  a.href = l.url;
  let host = ""; try { host = new URL(l.url).hostname; } catch (e) {}
  a.innerHTML = '<img alt="" src="https://www.google.com/s2/favicons?sz=64&domain=' + host + '"><span></span>';
  a.querySelector("span").textContent = l.name;
  nav.appendChild(a);
}
const q = document.getElementById("q"), hint = document.getElementById("hint");
q.addEventListener("input", () => {
  const m = q.value.match(/^!(\S+)/);
  const b = m && BANGS.find(x => x.key === m[1].toLowerCase());
  hint.textContent = b ? T.in + b.name : "";
});
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = q.value.trim();
  if (!v) return;
  const m = v.match(/^!(\S+)\s*(.*)$/);
  const b = m && BANGS.find(x => x.key === m[1].toLowerCase());
  if (b) { location.href = b.url.replace("%s", encodeURIComponent(m[2])); return; }
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v) || /^https?:\/\//.test(v)) { location.href = /^https?:/.test(v) ? v : "https://" + v; return; }
  location.href = ENGINE.replace("%s", encodeURIComponent(v));
});
</script>
</body>
</html>
