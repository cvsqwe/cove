font_family      JetBrainsMono Nerd Font
font_size        11.5
window_padding_width 10
background_opacity 0.94
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
shell /usr/bin/fish
tab_bar_style powerline

# Цвета генерирует Quickshell из обоев (services/Recolor.qml)
include theme.conf

# шелл меняет размер шрифта во всех окнах на лету (kitten @ set-font-size) — только через сокет процесса
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# вид из Настроек шелла → Терминал (services/TerminalLook.qml); перекрывает значения выше
include cove.conf
