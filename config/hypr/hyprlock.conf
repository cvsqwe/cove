general {
    hide_cursor = true
    grace = 0
}

background {
    path = ~/Wallpapers/Aether/aether-dark-2k.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cdd6f4)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"
    color = rgb(bac2de)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 2
    rounding = 14
    outer_color = rgb(cba6f7) rgb(89b4fa) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    placeholder_text = <span foreground="##6c7086">Пароль…</span>
    fail_text = Неверный пароль
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
